name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go mod verify
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # Known vulnerabilities that the code reaches, in the Go toolchain and
      # the modules. The runner, which runs on people's machines, fails CI on
      # any advisory until the dependency is updated.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./runner ./wire ./cmd/remote-harness
      # The kagent harness reaches advisories in kagent's dependencies, such as
      # the Ollama client, that have no fix. Report them without failing.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./internal/... ./cmd/harness || true

  # Every merge to main publishes both images as a pre-release of the next
  # patch version, such as 0.1.1-main.42 after v0.1.0.
  publish:
    if: github.event_name == 'push'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: harness
            image: ghcr.io/airohq/kagent-remote-harness
          - target: runner
            image: ghcr.io/airohq/kagent-remote-harness/runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the last release tag sets the version
      - name: Compute the version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<< "${last#v}"
          echo "version=$major.$minor.$((patch + 1))-main.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ matrix.image }}:main
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
